name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Para refrescar los datos periódicamente (cuando haya datos reales), descomentar:
  # schedule:
  #   - cron: "0 6 * * *"   # todos los días a las 06:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        # Cuando haya datos reales, pasar credenciales como secrets, por ejemplo:
        # env:
        #   DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
